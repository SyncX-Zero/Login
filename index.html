<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Animated Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
height:100vh;
background:url('background.jpg') center/cover no-repeat fixed;
overflow:hidden;
display:flex;align-items:center;justify-content:center;
cursor:none;color:white
}

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* Cursor */
.cursor-ball{
position:fixed;width:16px;height:16px;border-radius:50%;
pointer-events:none;background:white;
box-shadow:0 0 15px white,0 0 30px rgba(255,255,255,.6),0 0 60px rgba(255,255,255,.4);
transform:translate(-50%,-50%);z-index:5
}

.trail{
position:fixed;width:8px;height:8px;border-radius:50%;
background:rgba(255,255,255,.7);
pointer-events:none;z-index:4
}

/* Login box */
.login-box{
position:relative;z-index:2;width:360px;padding:40px 35px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
border-radius:16px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
text-align:center;transition:.35s;
}

.login-box:hover{
transform:translateY(-5px) scale(1.01);
box-shadow:0 30px 70px rgba(0,0,0,.6);
}

.login-box h2{margin-bottom:25px;}

.input{margin-bottom:18px;}

.input input{
width:100%;padding:12px 15px;border:none;border-radius:25px;
outline:none;background:rgba(255,255,255,.8);
color:black;font-size:14px;
transition:.25s;
}

.input input:focus{
background:white;
transform:scale(1.04);
box-shadow:0 0 18px rgba(255,255,255,.9);
}

.options{
display:flex;justify-content:space-between;
font-size:13px;margin-bottom:20px;
}

button{
width:100%;padding:12px;border:none;border-radius:25px;
background:white;font-weight:bold;cursor:pointer;
transition:transform .25s,box-shadow .25s;
}

button:hover{
transform:translateY(-3px) scale(1.03);
box-shadow:0 12px 25px rgba(0,0,0,.45);
}

.status{
margin-top:15px;
font-size:14px;
color:#00ffcc;
}
</style>
</head>

<body>

<canvas id="snow"></canvas>
<div class="cursor-ball" id="cursor"></div>

<div class="login-box">
    <h2>Login</h2>

    <div class="input">
        <input type="text" placeholder="Username" id="username">
    </div>

    <div class="input">
        <input type="password" placeholder="Password" id="password">
    </div>

    <div class="options">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <span id="status">Status: Waiting...</span>
    </div>

    <button onclick="loginClick()">Login</button>
</div>

<script>
/* ===== CURSOR + TRAIL ===== */
const cursor = document.getElementById('cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    createTrail(e.clientX, e.clientY);
});

function createTrail(x,y){
    const t = document.createElement('div');
    t.className = 'trail';
    t.style.left = x + 'px';
    t.style.top = y + 'px';
    document.body.appendChild(t);

    setTimeout(()=>{
        t.style.transition = '0.5s';
        t.style.opacity = '0';
        t.style.transform = 'scale(.3)';
    },10);

    setTimeout(()=> t.remove(), 500);
}

/* Hover scale */
document.querySelectorAll('input,button').forEach(el=>{
    el.addEventListener('mouseenter',()=>{
        cursor.style.transform='translate(-50%,-50%) scale(2)';
    });
    el.addEventListener('mouseleave',()=>{
        cursor.style.transform='translate(-50%,-50%) scale(1)';
    });
});

/* ===== SNOW + REPEL ===== */
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let snow = [];
for(let i=0;i<180;i++){
    snow.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3+1,
        s:Math.random()*1+0.6
    });
}

let mouse = {x:0,y:0};

document.addEventListener('mousemove',e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

function drawSnow(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle='white';
    ctx.beginPath();

    snow.forEach(p=>{
        ctx.moveTo(p.x,p.y);
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    });

    ctx.fill();

    snow.forEach(p=>{
        let dx = p.x - mouse.x;
        let dy = p.y - mouse.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 80){
            p.x += dx / 8;
            p.y += dy / 8;
        }

        p.y += p.s;

        if(p.y > canvas.height){
            p.y = 0;
            p.x = Math.random()*canvas.width;
        }
    });

    requestAnimationFrame(drawSnow);
}
drawSnow();

window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

/* ===== KEYAUTH LOGIN ===== */
const appName="Pawan X Cheat";
const ownerId="6noeS9fYdx";

function getHWID(){
    return btoa(navigator.userAgent+screen.width+screen.height);
}

const statusEl=document.getElementById("status");

async function loginClick(){
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value.trim();
    const remember=document.getElementById('remember').checked;

    if(!username||!password){
        statusEl.innerText="Status: Enter details!";
        return;
    }

    statusEl.innerText="Status: Checking...";

    try{
        const initRes=await fetch(
        `https://keyauth.win/api/1.2/?type=init&name=${encodeURIComponent(appName)}&ownerid=${ownerId}`
        );
        const initData=await initRes.json();

        if(!initData.success){
            statusEl.innerText="Status: Init Failed";
            return;
        }

        const sessionid=initData.sessionid;
        const hwid=getHWID();

        const loginRes=await fetch(
        `https://keyauth.win/api/1.2/?type=login&username=${encodeURIComponent(username)}&pass=${encodeURIComponent(password)}&name=${encodeURIComponent(appName)}&ownerid=${ownerId}&sessionid=${sessionid}&hwid=${hwid}`
        );

        const data=await loginRes.json();

        if(data.success){
            statusEl.innerText="Status: ✅ Login Success";

            if(remember){
                localStorage.setItem("user",username);
            }

        }else{
            statusEl.innerText="Status: ❌ "+data.message;
        }

    }catch(err){
        console.error(err);
        statusEl.innerText="Status: Server Error";
    }
}

/* ===== REMEMBER ME ===== */
window.onload=()=>{
    const savedUser=localStorage.getItem("user");
    if(savedUser){
        document.getElementById("username").value=savedUser;
        document.getElementById("remember").checked=true;
    }
}
</script>

</body>
</html>
